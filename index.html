<!DOCTYPE html>
<html>
<head>
    <title>My Links</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; padding: 50px; }
        .container { max-width: 400px; margin: auto; }
        .link-button {
            display: block;
            background-color: #007bff;
            color: white;
            padding: 15px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .link-button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Check out my links!</h1>
        <a class="link-button" href="https://google.com">My Portfolio</a>
        <a class="link-button" href="https://instagram.com">My Instagram</a>
        <a class="link-button" href="https://youtube.com">My YouTube</a>
    </div>
</body>
</html>
